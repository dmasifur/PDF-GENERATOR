[project]
name = "pdf-generator"
version = "1.0.0"
description = "Fill Albright placement PDF forms from an Excel sheet"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pypdf>=5.1.0", "openpyxl>=3.1.5"]

[project.scripts]
pdfgenerator = "pdf_generator.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.3.0",
    "ruff>=0.16.3",
    "types-openpyxl>=3.1.5.20260807",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_generator"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.14"
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
